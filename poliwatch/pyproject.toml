[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poliwatch"
version = "0.1.0"
description = "Open-source political accountability dashboard for congressional stock trade disclosures"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "streamlit>=1.35.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "plotly>=5.22.0",
    "apscheduler>=3.10.4",
    "loguru>=0.7.2",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.3",
    "lxml>=5.2.1",
    "beautifulsoup4>=4.12.3",
    "typer>=0.12.3",
    "python-dotenv>=1.0.1",
    "anyio>=4.4.0",
    "psycopg2-binary>=2.9.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-httpx>=0.30.0",
    "ruff>=0.4.7",
    "mypy>=1.10.0",
]

[project.scripts]
poliwatch = "poliwatch.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["poliwatch"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
